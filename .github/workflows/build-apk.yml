name: Build APK
run-name: "Dulce Tentación APK #${{ github.run_number }}"

on:
  workflow_dispatch:      # botón "Run workflow" en la pestaña Actions
  push:
    branches: [main]

jobs:
  # ------------------------------------------------------------------
  # 1) Compilar el APK (esto es lo que tú descargas)
  # ------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Flutter 3.29.x corresponde a Flet 0.28.x
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.2"

      - name: Instalar Flet
        run: pip install "flet==0.28.3"

      - name: Compilar APK
        run: flet build apk --verbose

      - uses: actions/upload-artifact@v4
        with:
          name: dulce-tentacion-apk
          path: build/apk

  # ------------------------------------------------------------------
  # 2) Probar el APK en un emulador y guardar captura + registros.
  #    No bloquea nada: el APK de arriba se puede descargar igual.
  # ------------------------------------------------------------------
  probar:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dulce-tentacion-apk
          path: apk

      - name: Habilitar KVM (emulador rápido)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Probar en emulador Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash tools/probar_emulador.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostico-emulador
          path: diagnostico
          if-no-files-found: ignore
